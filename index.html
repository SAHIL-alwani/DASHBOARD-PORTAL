<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Utility Systems Dashboard Portal</title><style>
:root{--primary:#1e40af;--navy:#172554;--accent:#06b6d4;--bg:#f4f7fb;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe4ef;--shadow:0 10px 26px rgba(15,23,42,.10)}html[data-theme=dark]{--bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;--border:#334155;--shadow:0 12px 30px rgba(0,0,0,.35)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}header{padding:2rem;display:flex;align-items:center;justify-content:space-between;color:#fff;background:linear-gradient(135deg,var(--primary),var(--navy));box-shadow:var(--shadow)}.brand{text-align:center;flex:1}h1{font-size:2rem;letter-spacing:-.04em}.brand p{margin-top:.35rem;opacity:.88}.theme{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:.65rem 1rem;font-weight:800;cursor:pointer}main{max-width:1450px;margin:auto;padding:2rem}.controls{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:var(--surface);padding:1.2rem;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:16px;margin-bottom:1.5rem}.search{flex:1;min-width:240px;position:relative}.search:before{content:"⌕";position:absolute;left:1rem;top:50%;transform:translateY(-55%);font-size:1.5rem;color:var(--muted)}input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;outline:0}input{width:100%;padding:.8rem .9rem .8rem 2.7rem}select{padding:.8rem .9rem;min-width:190px;cursor:pointer}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.16)}.label{font-size:.76rem;font-weight:900;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.project-filter{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.summary{color:var(--muted);font-size:.9rem;margin:0 0 1rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr)
