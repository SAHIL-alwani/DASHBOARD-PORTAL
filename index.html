<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Portal - Utility Systems</title>
<style>
:root{--primary:#1e40af;--primary-dark:#172554;--accent:#06b6d4;--bg:#f5f8fc;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe4ef;--prod:#059669;--prod-bg:#d1fae5;--tnd:#d97706;--tnd-bg:#fef3c7;--shadow:0 8px 22px rgba(15,23,42,.09)}
html[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;--border:#334155;--prod-bg:rgba(16,185,129,.16);--tnd-bg:rgba(245,158,11,.16);--shadow:0 10px 30px rgba(0,0,0,.32)}
*{box-sizing:border-box;margin:0;padding:0} body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:2.5rem 2rem;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:1rem}.title-wrap{text-align:center;flex:1}h1{font-size:2.25rem;letter-spacing:-.04em}.subtitle{opacity:.9;margin-top:.35rem}.mode-toggle{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:.7rem 1rem;font-weight:700;cursor:pointer}.mode-toggle:hover{background:rgba(255,255,255,.26)}
main{max-width:1400px;margin:0 auto;padding:2rem}.controls{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);padding:1.25rem;border-radius:16px;margin-bottom:1.75rem}.search-box{flex:1;min-width:240px;position:relative}.search-box:before{content:"⌕";position:absolute;left:1rem;top:50%;transform:translateY(-53%);font-size:1.55rem;color:var(--muted)}input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;outline:none;transition:.2s}input{width:100%;padding:.8rem .9rem .8rem 2.7rem}select{padding:.8rem .9rem;min-width:150px;cursor:pointer}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.16)}.filter-group{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.filter-label{font-size:.78rem;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tabs{border-bottom:2px solid var(--border);display:flex;gap:.4rem;margin-bottom:1.75rem}.tab-button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;padding:.9rem 1.3rem;cursor:pointer;position:relative}.tab-button.active{color:var(--primary)}.tab-button.active:after{content:"";height:3px;position:absolute;bottom:-2px;left:0;right:0;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}.tab-content{display:none}.tab-content.active{display:block;animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.35rem}.dashboard-card{background:var(--surface);text-decoration:none;color:var(--text);border:1px solid var(--border);border-radius:16px;overflow:hidden;min-height:245px;box-shadow:0 4px 12px rgba(15,23,42,.06);transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column}.dashboard-card:hover{transform:translateY(-7px);box-shadow:var(--shadow);border-color:var(--accent)}.card-image{height:120px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(30,64,175,.12),rgba(6,182,212,.14));color:var(--primary)}.dashboard-card.prod .card-image{background:linear-gradient(135deg,rgba(5,150,105,.12),rgba(6,182,212,.13));color:var(--prod)}.dashboard-card.tnd .card-image{background:linear-gradient(135deg,rgba(217,119,6,.13),rgba(251,146,60,.15));color:var(--tnd)}.card-svg{width:78px;height:78px}.card-info{padding:1.25rem;display:flex;flex-direction:column;justify-content:space-between;flex:1}.card-title{font-size:1.2rem;font-weight:850}.card-package{color:var(--muted);font-size:.9rem;margin-top:.35rem}.card-bottom{margin-top:1rem}.badge{display:inline-block;font-size:.72rem;letter-spacing:.06em;font-weight:900;padding:.3rem .7rem;border-radius:999px}.badge-prod{color:var(--prod);background:var(--prod-bg);border:1px solid var(--prod)}.badge-tnd{color:var(--tnd);background:var(--tnd-bg);border:1px solid var(--tnd)}.card-url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:.72rem;word-break:break-all;border-top:1px solid var(--border);margin-top:.8rem;padding-top:.75rem;opacity:.8}.empty-state{grid-column:1/-1;text-align:center;padding:4rem 1rem;background:var(--surface);border:1px dashed var(--border);border-radius:16px;color:var(--muted)}.empty-state-icon{font-size:3rem;margin-bottom:.5rem}footer{text-align:center;color:var(--muted);padding:2rem;margin-top:2rem;border-top:1px solid var(--border)}
@media(max-width:720px){header{padding:2rem 1rem;flex-direction:column}h1{font-size:1.75rem}main{padding:1rem}.controls{align-items:stretch}.filter-group{width:100%}.filter-group select{flex:1;min-width:130px}.dashboard-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="title-wrap"><h1>📊 Dashboard Portal</h1><p class="subtitle">Unified access to utility monitoring systems</p></div><button class="mode-toggle" id="modeToggle" type="button">🌙 Dark Mode</button></header>
<main>
<div class="controls">
  <div class="search-box"><input id="searchInput" type="search" placeholder="Search dashboards by name or package..."></div>
  <div class="filter-group"><span class="filter-label">Project</span><select id="projectFilter"><option value="all">All Projects</option></select></div>
  <div class="filter-group"><span class="filter-label">Type</span><select id="typeFilter"><option value="all">All Types</option><option value="prod">Production</option><option value="tnd">TND</option></select></div>
</div>
<div class="tabs"><button class="tab-button active" data-tab="mdm" type="button">MDM Systems</button><button class="tab-button" data-tab="hes" type="button">HES Systems</button></div>
<div id="mdm" class="tab-content active"><div class="dashboard-grid" id="mdm-grid"></div></div>
<div id="hes" class="tab-content"><div class="dashboard-grid" id="hes-grid"></div></div>
</main>
<footer>Dashboard Portal • Securely manage your utility system access</footer>
<script>
const dashboardData={mdm:[
{name:"CSPDCL",package:"PROD DC 1",type:"prod",url:"https://ws1dc.cspdcl.co.in/urjaplus/login"},{name:"CSPDCL",package:"TND DC 1",type:"tnd",url:"https://tndws1dc.cspdcl.co.in/urjaplus/login"},{name:"CSPDCL",package:"PROD DC 3",type:"prod",url:"https://ws3dc.cspdcl.co.in/urjaplus/main-dashboard"},{name:"CSPDCL",package:"TND DC 3",type:"tnd",url:"https://tndws3dc.cspdcl.co.in/"},{name:"PUVVNL",package:"Genus PUVVNL",type:"prod",url:"https://mdm.genuspuvvnl.in/urjaplus/main-dashboard"},{name:"DVVNL",package:"Genus DVVNL",type:"prod",url:"https://mdm.genusdvvnl.in/urjaplus/"},{name:"KESCO",package:"Genus KESCO",type:"prod",url:"https://mdm.genuskesco.in/login"},{name:"MSEDCL",package:"Genus MSEDCL",type:"prod",url:"https://mdm.smartmsedcl.in"},{name:"JBVNL-292",package:"JBVNL RDS SGemstar",type:"prod",url:"https://mdm.jbvnlrdssgemstar.co.in"},{name:"JPDCL",package:"RDSS JPDCL",type:"prod",url:"https://mdm.rdssjpdcl.com"},{name:"UPCL",package:"UPCL Genus",type:"prod",url:"https://mdm.upclgenus.com/"},{name:"JVVNL (Jaipur-95)",package:"JVVNL Dhundara Misp",type:"prod",url:"https://mdm.jvvnldhundaramisp.in"},{name:"JVVNL (Jaipur-96)",package:"JVVNL Banasami Sp",type:"prod",url:"https://mdm.jvvnlbanasamisp.in/"},{name:"JVVNL (Jaipur-97)",package:"JVVNL Braja Misp",type:"prod",url:"https://mdm.jvvnlbrajamisp.in/"},{name:"JDVVNL-32",package:"JDVVNL Marwar",type:"prod",url:"https://mdm.jdvvnlmarwar.in/"},{name:"JDVVNL-33",package:"JDVVNL Bikana",type:"prod",url:"https://mdm.jdvvnlbikana.in/"},{name:"JDVVNL-34",package:"JDVVNL Marudhara",type:"prod",url:"https://mdm.jdvvnlmarudhara.in/"},{name:"AVVNL-58",package:"AVVNL Rajputana",type:"prod",url:"https://mdm.avvnlrajputana.in/"},{name:"AVVNL-59",package:"AVVNL Shekhawati",type:"prod",url:"https://mdm.avvnlshekhawati.in/"},{name:"AVVNL-60",package:"AVVNL Mewar",type:"prod",url:"https://mdm.avvnlmewar.in/"}],hes:[
{name:"Assam PKG-02",package:"APDCL PKG-02",type:"prod",url:"https://hes.pkg2apdcl.com/"},{name:"Assam PKG-03",package:"APDCL PKG-03",type:"prod",url:"https://hes.pkg3apdcl.com/"},{name:"Assam PKG-04",package:"APDCL PKG-04",type:"prod",url:"https://hes.pkg4apdcl.com/"},{name:"Assam PKG-05",package:"APDCL PKG-05",type:"prod",url:"https://hes.pkg5apdcl.com/"},{name:"CSPDCL PKG-1",package:"CSPDCL PKG-1",type:"prod",url:"http://10.63.23.26"},{name:"CSPDCL PKG-3",package:"CSPDCL PKG-3",type:"prod",url:"http://10.63.23.106"},{name:"PUVVNL",package:"PUVVNL",type:"prod",url:"http://10.69.1.210"},{name:"DVVNL",package:"DVVNL",type:"prod",url:"http://10.69.129.63"},{name:"KESCO",package:"KESCO",type:"prod",url:"http://10.69.129.63:9891"},{name:"MSEDCL",package:"MSEDCL",type:"prod",url:"http://10.92.20.68:9885/"},{name:"NBPDCL",package:"NBPDCL",type:"prod",url:"http://103.19.138.3/"},{name:"SBPDCL",package:"SBPDCL",type:"prod",url:"http://10.58.8.180/"},{name:"JBVNL-292",package:"JBVNL RDS SGemstar",type:"prod",url:"https://hes.jbvnlrdssgemstar.co.in/"},{name:"JPDCL",package:"JPDCL",type:"prod",url:"https://hes.rdssjpdcl.com"},{name:"UPCL",package:"UPCL",type:"prod",url:"https://hes.upclgenus.com/"},{name:"JVVNL (Jaipur-95)",package:"JVVNL Dhundara Misp",type:"prod",url:"https://hes.jvvnldhundaramisp.in/"},{name:"JVVNL (Jaipur-96)",package:"JVVNL Banasami Sp",type:"prod",url:"https://hes.jvvnlbanasamisp.in"},{name:"JVVNL (Jaipur-97)",package:"JVVNL Braja Misp",type:"prod",url:"https://hes.jvvnlbrajamisp.in/"},{name:"JDVVNL-32",package:"JDVVNL Marwar",type:"prod",url:"https://hes.jdvvnlmarwar.in/"},{name:"JDVVNL-33",package:"JDVVNL Bikana",type:"prod",url:"https://hes.jdvvnlbikana.in/"},{name:"JDVVNL-34",package:"JDVVNL Marudhara",type:"prod",url:"https://hes.jdvvnlmarudhara.in/"},{name:"AVVNL-58",package:"AVVNL Rajputana",type:"prod",url:"https://hes.avvnlrajputana.in/"},{name:"AVVNL-59",package:"AVVNL Shekhawati",type:"prod",url:"https://hes.avvnlshekhawati.in"},{name:"AVVNL-60",package:"AVVNL Mewar",type:"prod",url:"https://hes.avvnlmewar.in"}]};
const icon={mdm:`<svg class="card-svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="20" y="14" width="60" height="52" rx="5"/><path d="M34 27h32M34 37h32M34 47h17"/><circle cx="35" cy="58" r="5" fill="currentColor"/><circle cx="50" cy="58" r="5" fill="currentColor"/><circle cx="65" cy="58" r="5" fill="currentColor"/><path d="M30 78h40" stroke-width="8" stroke-linecap="round"/></svg>`,hes:`<svg class="card-svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="14" y="20" width="72" height="60" rx="5"/><path d="m30 35 16 15-16 15M52 50h19"/><circle cx="30" cy="35" r="3" fill="currentColor"/><circle cx="30" cy="65" r="3" fill="currentColor"/></svg>`};
const $=s=>document.querySelector(s); const activeTab=()=>$('.tab-button.active').dataset.tab;
function populateProjects(){const names=[...new Set(Object.values(dashboardData).flat().map(x=>x.name))].sort();$('#projectFilter').insertAdjacentHTML('beforeend',names.map(n=>`<option value="${n}">${n}</option>`).join(''))}
function render(type=activeTab()){const q=$('#searchInput').value.trim().toLowerCase(),project=$('#projectFilter').value,kind=$('#typeFilter').value;const items=dashboardData[type].filter(d=>(!q||`${d.name} ${d.package}`.toLowerCase().includes(q))&&(project==='all'||d.name===project)&&(kind==='all'||d.type===kind));const grid=$('#'+type+'-grid');grid.innerHTML=items.length?items.map(d=>`<a class="dashboard-card ${d.type}" href="${d.url}" target="_blank" rel="noopener noreferrer"><div class="card-image">${icon[type]}</div><div class="card-info"><div><div class="card-title">${d.name}</div><div class="card-package">${d.package}</div></div><div class="card-bottom"><span class="badge badge-${d.type}">${d.type==='prod'?'PROD':'TND'}</span><div class="card-url">🔗 ${d.url}</div></div></div></a>`).join(''):`<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No dashboards match your filters.</p></div>`}
$('.tabs').addEventListener('click',e=>{if(!e.target.matches('.tab-button'))return;document.querySelectorAll('.tab-button,.tab-content').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');$('#'+e.target.dataset.tab).classList.add('active');render()});
['searchInput','projectFilter','typeFilter'].forEach(id=>$('#'+id).addEventListener(id==='searchInput'?'input':'change',()=>render()));
function setupTheme(){const saved=localStorage.getItem('portal-theme');const dark=saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';$('#modeToggle').textContent=dark?'☀️ Light Mode':'🌙 Dark Mode';$('#modeToggle').onclick=()=>{const isDark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=isDark?'light':'dark';localStorage.setItem('portal-theme',isDark?'light':'dark');$('#modeToggle').textContent=isDark?'🌙 Dark Mode':'☀️ Light Mode'}}
populateProjects();setupTheme();render('mdm');
</script>
</body>
</html>
